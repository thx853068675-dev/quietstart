name: Publish XiaoBai integrated bundles
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful XiaoBai integrated bundles build run ID
        required: true
      source_sha:
        description: Exact head SHA of that reviewed build run
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Verify build and download the two complete bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['RUN_ID']
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9]+', run_id)
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['name'] == 'XiaoBai integrated bundles'
          assert run['conclusion'] == 'success' and run['head_sha'] == sha
          subprocess.run(['gh', 'run', 'download', run_id, '--dir', 'artifacts'], check=True)
          PY
      - name: Validate and publish consolidated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, zipfile
          from pathlib import Path
          expected = '242cd4c309333e7aa1b00ded05c89056671348034f293cf20b198b4493d5f03c'
          files = sorted(Path('artifacts').glob('*/*.zip'))
          assert {p.name for p in files} == {'quietstart-0.9.43-macOS-arm64-bundle.zip', 'quietstart-0.9.43-Windows-x64-bundle.zip'}
          for path in files:
              with zipfile.ZipFile(path) as archive:
                  names = [n for n in archive.namelist() if n.endswith('/quietstart-0.9.43.hap')]
                  assert len(names) == 1 and hashlib.sha256(archive.read(names[0])).hexdigest() == expected
          checksums = Path('SHA256SUMS.txt')
          checksums.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          subprocess.run(['gh', 'release', 'upload', 'v0.9.43', *map(str, files), str(checksums), '--clobber'], check=True)
          subprocess.run(['gh', 'release', 'edit', 'v0.9.43', '--title', '轻启 0.9.43 · 小白整合安装包', '--notes-file', 'integrations/xiaobai/RELEASE.md'], check=True)
          # New downloads exist before retiring the older split packaging.
          assets = json.loads(subprocess.check_output(['gh', 'release', 'view', 'v0.9.43', '--json', 'assets']))['assets']
          existing = {a['name'] for a in assets}
          for old in ['quietstart-0.9.43-precompiled.hap', 'quietstart-0.9.43-resign-kit.zip']:
              if old in existing:
                  subprocess.run(['gh', 'release', 'delete-asset', 'v0.9.43', old, '--yes'], check=True)
          PY
