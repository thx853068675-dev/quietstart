<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">轻启 · 本机自动化</title>
  <desc id="desc">轻启应用界面示意：概览状态、本机连接、规则管理与运行记录。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faf7"/>
      <stop offset="1" stop-color="#e7f1eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8eee1"/>
      <stop offset="1" stop-color="#c8e3d7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#164b3f" flood-opacity=".14"/>
    </filter>
    <clipPath id="frontScreen"><rect x="993" y="75" width="345" height="480" rx="31"/></clipPath>
    <clipPath id="backScreen"><rect x="1250" y="121" width="282" height="422" rx="28"/></clipPath>
  </defs>
  <rect width="1600" height="600" rx="36" fill="url(#background)"/>
  <circle cx="1437" cy="82" r="260" fill="url(#glow)" opacity=".72"/>
  <circle cx="808" cy="608" r="285" fill="#dff0e5" opacity=".85"/>
  <path d="M0 490 C250 425 430 560 690 470 S1170 485 1600 375" fill="none" stroke="#c8e2d2" stroke-width="2" opacity=".75"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="76" y="65" width="118" height="38" rx="19" fill="#dcefe3"/>
    <circle cx="99" cy="84" r="7" fill="#227262"/>
    <text x="118" y="91" font-size="18" font-weight="600" fill="#1d6758">HarmonyOS</text>
    <text x="72" y="237" font-size="102" font-weight="750" letter-spacing="3" fill="#173d35">轻启</text>
    <rect x="75" y="262" width="80" height="7" rx="3.5" fill="#67b996"/>
    <text x="73" y="333" font-size="36" font-weight="600" fill="#2a594e">本机自动化 · 由你定义</text>
    <text x="76" y="382" font-size="23" fill="#54726a">连接设备，管理规则，查看每一次执行。</text>

    <g font-size="19" font-weight="600" fill="#245f51">
      <rect x="75" y="438" width="157" height="47" rx="23.5" fill="#ffffff" stroke="#c5e1d0"/>
      <circle cx="100" cy="461" r="8" fill="#67b996"/><text x="118" y="468">本机连接</text>
      <rect x="248" y="438" width="157" height="47" rx="23.5" fill="#ffffff" stroke="#c5e1d0"/>
      <circle cx="273" cy="461" r="8" fill="#67b996"/><text x="291" y="468">规则管理</text>
      <rect x="421" y="438" width="157" height="47" rx="23.5" fill="#ffffff" stroke="#c5e1d0"/>
      <circle cx="446" cy="461" r="8" fill="#67b996"/><text x="464" y="468">运行记录</text>
    </g>
  </g>

  <!-- Two simplified screens use the same green cards and bottom navigation as the app. -->
  <g filter="url(#shadow)">
    <rect x="1238" y="109" width="306" height="446" rx="38" fill="#e7eee9"/>
    <rect x="1250" y="121" width="282" height="422" rx="28" fill="#fff"/>
  </g>
  <g clip-path="url(#backScreen)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="1250" y="121" width="282" height="422" fill="#f9fbf9"/>
    <text x="1365" y="172" font-size="24" font-weight="700" fill="#173d35">规则</text>
    <text x="1365" y="200" font-size="14" fill="#6e8980">自主管理</text>
    <rect x="1359" y="224" width="153" height="80" rx="18" fill="#fff" stroke="#e5eee7"/>
    <circle cx="1383" cy="264" r="13" fill="#d9efe2"/>
    <text x="1405" y="259" font-size="16" font-weight="650" fill="#27443b">示例应用</text>
    <text x="1405" y="281" font-size="13" fill="#628075">已启用</text>
    <rect x="1359" y="317" width="153" height="80" rx="18" fill="#fff" stroke="#e5eee7"/>
    <circle cx="1383" cy="357" r="13" fill="#e9f2df"/>
    <text x="1405" y="352" font-size="16" font-weight="650" fill="#27443b">更多应用</text>
    <text x="1405" y="374" font-size="13" fill="#628075">自行选择</text>
    <rect x="1359" y="411" width="153" height="82" rx="18" fill="#e4f2e9"/>
    <text x="1377" y="445" font-size="16" font-weight="650" fill="#255b4b">清晰可查</text>
    <text x="1377" y="470" font-size="13" fill="#5b7b6e">规则与记录</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="981" y="63" width="369" height="504" rx="41" fill="#dfe9e2"/>
    <rect x="993" y="75" width="345" height="480" rx="31" fill="#fff"/>
  </g>
  <g clip-path="url(#frontScreen)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="993" y="75" width="345" height="480" fill="#fafcf9"/>
    <text x="1018" y="122" font-size="27" font-weight="750" fill="#183e35">轻启</text>
    <text x="1019" y="148" font-size="14" fill="#759187">概览</text>
    <rect x="1016" y="169" width="299" height="174" rx="25" fill="#1f6758"/>
    <text x="1038" y="205" font-size="23" font-weight="700" fill="#fff">正在为你守候</text>
    <rect x="1224" y="183" width="70" height="27" rx="13.5" fill="#458879"/>
    <circle cx="1237" cy="196.5" r="5" fill="#8fe7c5"/>
    <text x="1249" y="202" font-size="13" fill="#fff">在线</text>
    <text x="1038" y="237" font-size="15" fill="#c9e6da">已连接，等待页面操作</text>
    <path d="M1038 270h255" stroke="#529182" stroke-width="1"/>
    <text x="1038" y="305" font-size="16" font-weight="600" fill="#f0fff8">连接状态</text>
    <text x="1279" y="305" text-anchor="end" font-size="16" font-weight="600" fill="#f0fff8">运行中</text>
    <rect x="1016" y="358" width="299" height="78" rx="21" fill="#fff" stroke="#e3eee7"/>
    <text x="1038" y="391" font-size="19" font-weight="650" fill="#2a493e">自动执行</text>
    <text x="1038" y="416" font-size="13" fill="#6f887d">仅执行已确认并启用的规则</text>
    <rect x="1254" y="380" width="43" height="24" rx="12" fill="#24715e"/>
    <circle cx="1284" cy="392" r="9" fill="#fff"/>
    <rect x="1016" y="450" width="299" height="54" rx="19" fill="#fff" stroke="#e3eee7"/>
    <text x="1038" y="484" font-size="18" font-weight="600" fill="#2a493e">运行记录</text>
    <path d="m1282 472 7 7-7 7" fill="none" stroke="#789386" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="993" y="522" width="345" height="33" fill="#fff"/>
    <circle cx="1053" cy="538" r="5" fill="#23715e"/><circle cx="1134" cy="538" r="5" fill="#aebdb4"/>
    <circle cx="1216" cy="538" r="5" fill="#aebdb4"/><circle cx="1296" cy="538" r="5" fill="#aebdb4"/>
  </g>
</svg>
