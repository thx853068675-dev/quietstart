<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">轻启 · 本机自动化</title>
  <desc id="desc">轻启应用界面示意：概览状态、本机连接、规则管理与运行记录。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faf7"/>
      <stop offset="1" stop-color="#e7f1eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8eee1"/>
      <stop offset="1" stop-color="#c8e3d7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#164b3f" flood-opacity=".14"/>
    </filter>
    <clipPath id="bannerOutline"><rect width="1600" height="600" rx="36"/></clipPath>
    <clipPath id="frontScreen"><rect x="993" y="75" width="345" height="480" rx="31"/></clipPath>
    <clipPath id="backScreen"><rect x="1250" y="121" width="282" height="422" rx="28"/></clipPath>
  </defs>
  <rect width="1600" height="600" rx="36" fill="url(#background)"/>
  <g clip-path="url(#bannerOutline)">
    <circle cx="1437" cy="82" r="260" fill="url(#glow)" opacity=".72"/>
    <circle cx="808" cy="608" r="285" fill="#dff0e5" opacity=".85"/>
    <path d="M0 490 C250 425 430 560 690 470 S1170 485 1600 375" fill="none" stroke="#c8e2d2" stroke-width="2" opacity=".75"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="76" y="65" width="202" height="38" rx="19" fill="#dcefe3"/>
    <circle cx="99" cy="84" r="7" fill="#227262"/>
    <text x="118" y="91" font-size="18" font-weight="600" fill="#1d6758">HarmonyOS NEXT</text>
    <text x="72" y="237" font-size="102" font-weight="750" letter-spacing="3" fill="#173d35">轻启</text>
    <rect x="75" y="262" width="80" height="7" rx="3.5" fill="#67b996"/>
    <text x="73" y="333" font-size="36" font-weight="600" fill="#2a594e">本机自动化 · 由你定义</text>
    <text x="76" y="382" font-size="23" fill="#54726a">连接设备，管理规则，查看每一次执行。</text>

    <g font-size="19" font-weight="600" fill="#245f51">
      <rect x="75" y="438" width="157" height="47" rx="23.5" fill="#ffffff" stroke="#c5e1d0"/>
      <circle cx="100" cy="461" r="8" fill="#67b996"/><text x="118" y="468">本机连接</text>
      <rect x="248" y="438" width="157" height="47" rx="23.5" fill="#ffffff" stroke="#c5e1d0"/>
      <circle cx="273" cy="461" r="8" fill="#67b996"/><text x="291" y="468">规则管理</text>
      <rect x="421" y="438" width="157" height="47" rx="23.5" fill="#ffffff" stroke="#c5e1d0"/>
      <circle cx="446" cy="461" r="8" fill="#67b996"/><text x="464" y="468">运行记录</text>
    </g>
  </g>

  <!-- Two simplified screens use the same green cards and bottom navigation as the app. -->
  <g filter="url(#shadow)">
    <rect x="1238" y="109" width="306" height="446" rx="38" fill="#e7eee9"/>
    <rect x="1250" y="121" width="282" height="422" rx="28" fill="#fff"/>
  </g>
  <g clip-path="url(#backScreen)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="1250" y="121" width="282" height="422" fill="#f9fbf9"/>
    <text x="1364" y="166" font-size="26" font-weight="700" fill="#173d35">规则</text>
    <rect x="1359" y="187" width="153" height="39" rx="13" fill="#fff" stroke="#e5eee7"/>
    <circle cx="1379" cy="206" r="7" fill="none" stroke="#377866" stroke-width="2"/>
    <path d="m1384 211 5 5" stroke="#377866" stroke-width="2" stroke-linecap="round"/>
    <text x="1397" y="211" font-size="12" fill="#8a9d92">搜索应用、按钮…</text>
    <rect x="1359" y="240" width="153" height="37" rx="18" fill="#eaf2ec"/>
    <rect x="1435" y="243" width="74" height="31" rx="16" fill="#fff"/>
    <text x="1397" y="264" text-anchor="middle" font-size="12" fill="#71887b">待确认</text>
    <text x="1472" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#24715e">全部规则</text>
    <rect x="1359" y="292" width="153" height="170" rx="19" fill="#fff" stroke="#e5eee7"/>
    <circle cx="1381" cy="318" r="12" fill="#d9efe2"/>
    <text x="1402" y="324" font-size="15" font-weight="650" fill="#27443b">示例应用</text>
    <path d="M1377 345h117" stroke="#e5eee7"/>
    <text x="1377" y="374" font-size="13" fill="#28483c">执行目标</text>
    <rect x="1377" y="390" width="75" height="23" rx="11.5" fill="#e6f3eb"/>
    <text x="1414" y="406" text-anchor="middle" font-size="12" fill="#24715e">已启用</text>
    <text x="1377" y="440" font-size="12" fill="#7b9285">1 条规则</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="981" y="63" width="369" height="504" rx="41" fill="#dfe9e2"/>
    <rect x="993" y="75" width="345" height="480" rx="31" fill="#fff"/>
  </g>
  <g clip-path="url(#frontScreen)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="993" y="75" width="345" height="480" fill="#fafcf9"/>
    <text x="1016" y="105" font-size="12" fill="#24715e">已开启 · 计算任务</text>
    <text x="1016" y="143" font-size="29" font-weight="750" fill="#183e35">轻启</text>
    <text x="1092" y="141" font-size="12" fill="#71887e">v1.1.0</text>
    <rect x="1016" y="159" width="299" height="169" rx="23" fill="#1f6758"/>
    <text x="1033" y="191" font-size="21" font-weight="700" fill="#fff">正在为你守候</text>
    <rect x="1227" y="171" width="69" height="26" rx="13" fill="#458879"/>
    <circle cx="1240" cy="184" r="5" fill="#8fe7c5"/>
    <text x="1252" y="189" font-size="12" fill="#fff">在线</text>
    <text x="1033" y="220" font-size="13" fill="#c9e6da">新样式会出现在规则页。</text>
    <text x="1075" y="278" text-anchor="middle" font-size="31" font-weight="650" fill="#fff">15</text>
    <text x="1165" y="278" text-anchor="middle" font-size="31" font-weight="650" fill="#fff">19</text>
    <text x="1255" y="278" text-anchor="middle" font-size="31" font-weight="650" fill="#fff">6</text>
    <text x="1075" y="304" text-anchor="middle" font-size="12" fill="#c9e6da">执行应用</text>
    <text x="1165" y="304" text-anchor="middle" font-size="12" fill="#c9e6da">启用规则</text>
    <text x="1255" y="304" text-anchor="middle" font-size="12" fill="#c9e6da">本次已执行</text>
    <rect x="1016" y="340" width="299" height="75" rx="18" fill="#fff"/>
    <text x="1034" y="368" font-size="18" fill="#2a493e">自动执行</text>
    <text x="1034" y="392" font-size="12" fill="#6f887d">仅执行你已确认并启用的规则</text>
    <rect x="1254" y="360" width="43" height="24" rx="12" fill="#24715e"/>
    <circle cx="1284" cy="372" r="9" fill="#fff"/>
    <rect x="1016" y="425" width="299" height="89" rx="18" fill="#fff"/>
    <text x="1033" y="447" font-size="13" fill="#2a493e">运行记录</text>
    <path d="m1285 438 5 5-5 5" fill="none" stroke="#789386" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M1033 454h265" stroke="#e9eee9"/>
    <text x="1033" y="476" font-size="13" fill="#2a493e">会话详情</text>
    <path d="m1285 467 5 5-5 5" fill="none" stroke="#789386" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M1033 484h265" stroke="#e9eee9"/>
    <text x="1033" y="505" font-size="13" fill="#2a493e">使用指南</text>
    <path d="m1285 495 5 5-5 5" fill="none" stroke="#789386" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="993" y="522" width="345" height="33" fill="#fff"/>
    <circle cx="1053" cy="538" r="5" fill="#23715e"/><circle cx="1134" cy="538" r="5" fill="#aebdb4"/>
    <circle cx="1216" cy="538" r="5" fill="#aebdb4"/><circle cx="1296" cy="538" r="5" fill="#aebdb4"/>
  </g>
</svg>
